name: daily
on:
  schedule: [{cron: "0 14 * * 1-5"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install yfinance git+https://github.com/ZhuLinsen/alphasift.git
      - run: python build.py
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add index.html data.json
          git commit -m "update" || echo "no changes"
          git push
